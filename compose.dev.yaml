# Local development services only. On Runpod these run inside the single pod image.
# Host ports are non-default so they do not clash with databases already on the machine.
name: docqa-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 2s
      timeout: 2s
      retries: 30

  valkey:
    image: valkey/valkey:9
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:56333:6333"
      - "127.0.0.1:56334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
